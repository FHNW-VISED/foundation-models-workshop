[project]
name = "foundation-models-workshop"
version = "0.1.0"
description = "When Foundation Models Fall Short: From Off-the-Shelf AI to Problem-Specific Adaptation"
requires-python = ">=3.12,<3.13"  # Colab's Python line; keep in step with SPEC.md › Environment
# Runtime deps = what the notebook imports. Prefer packages Colab preinstalls; pin to the Colab
# version recorded in SPEC.md › Environment so the smoke run sees what students see.
dependencies = [
    # pinned to Colab's GPU runtime (googlecolab/backend-info, 2026-10-19); torch/torchvision CPU wheels locally
    "numpy==2.1.3",
    "pandas==2.2.3",
    "matplotlib==3.10.0",
    "pillow==11.3.0",
    "scikit-image==0.25.2",
    "scikit-learn==1.6.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "timm==1.0.30",
    "transformers==5.18.0",
    "grad-cam",  # not in Colab: %pip install in 00_setup
]

[dependency-groups]
dev = [
    "jupytext>=1.16",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "pytest>=8",
    "ruff>=0.6",
    "jupyterlab>=4",
    "markdown>=3.11.2",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E402"]  # notebook sections import where they are taught

[tool.ruff.lint.per-file-ignores]
"sections/*.py" = ["F821", "F811"]  # names come from earlier sections (one shared kernel)

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
