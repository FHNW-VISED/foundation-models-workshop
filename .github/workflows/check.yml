name: check
on:
  push:
    branches: [main, "night/**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - run: uv sync
      - run: just drift   # committed .ipynb == fresh build of sections/
      - run: just check
